<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SearchID · Consulta de Centros Educativos</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#182033;--muted:#6b7280;--line:#e2e8f0;--blue:#2563eb;--blue2:#1d4ed8;--soft:#eaf1ff;--danger:#b42318;--dangerbg:#fff1f0;--ok:#087f5b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}
.wrap{max-width:1120px;margin:auto;padding:24px 18px 48px}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb 58%,#0ea5e9);color:#fff;border-radius:22px;padding:25px 26px;box-shadow:0 12px 28px rgba(37,99,235,.18)}
.hero h1{margin:0 0 6px;font-size:clamp(25px,4vw,37px)}.hero p{margin:0;opacity:.9}.search{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.search input{flex:1 1 270px;min-height:48px;border:0;border-radius:12px;padding:0 16px;font-size:16px;outline:none}.btn{min-height:44px;border:0;border-radius:11px;padding:0 17px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}.dark{background:#111827;color:#fff}.primary{background:var(--blue);color:#fff}.light{background:#eef2f7;color:#263449}.danger{background:var(--dangerbg);color:var(--danger);border:1px solid #f2c5c0}
#status{margin-top:13px;min-height:20px;font-size:14px}.hidden{display:none!important}.summary{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 19px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:stretch;box-shadow:0 8px 24px rgba(32,55,85,.06)}
.school{display:flex;flex-direction:column;justify-content:center;min-width:0}.eyebrow{color:var(--blue);font-size:13px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.school h2{margin:7px 0 10px;font-size:clamp(25px,3.4vw,36px);line-height:1.08;overflow-wrap:anywhere}
.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{background:var(--soft);color:#224bb5;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800}
.photo{min-height:155px;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#f1f4f8;position:relative;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;min-height:155px;object-fit:cover;display:block}.no-photo{text-align:center;color:#7b8493;font-size:14px;padding:18px}.no-photo b{display:block;font-size:32px;margin-bottom:7px}
.photo-actions{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;background:rgba(255,255,255,.92);padding:6px;border-radius:10px;backdrop-filter:blur(6px)}.photo-actions .btn{min-height:34px;padding:0 9px;font-size:12px;flex:1}
.toolbar{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(32,55,85,.05)}.card h3{margin:0 0 13px;font-size:18px}
.row{display:grid;grid-template-columns:165px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid #edf1f5}.row:first-of-type{border-top:0}.label{color:var(--muted);font-size:14px}.value{font-weight:650;overflow-wrap:anywhere}.empty{color:#8a93a2;font-style:italic;font-weight:500}
.contacts{margin-top:18px}.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.contact{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fbfcfe;min-width:0}.contact .name{font-weight:800;margin-bottom:9px;overflow-wrap:anywhere}.contact .meta{font-size:14px;line-height:1.6;color:#374151;overflow-wrap:anywhere}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;color:#5f6978;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;min-height:43px;border:1px solid #ced6e2;border-radius:10px;padding:9px 11px;color:var(--text);outline:none;background:#fff}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.edit-contact{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfe}.edit-contact h4{margin:0 0 11px}.edit-contact .edit-grid{grid-template-columns:1fr}.note{margin-top:15px;color:var(--muted);font-size:13px}.message{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}.message.ok{background:#ecfdf5;color:var(--ok)}.message.err{background:var(--dangerbg);color:var(--danger)}.busy{opacity:.62;pointer-events:none}
@media(max-width:800px){.summary{grid-template-columns:1fr}.photo,.photo img{min-height:190px}.grid,.contact-grid{grid-template-columns:1fr}}
@media(max-width:540px){.wrap{padding:14px 10px 34px}.hero{padding:21px 17px;border-radius:17px}.summary,.card{padding:16px;border-radius:15px}.row{grid-template-columns:1fr;gap:4px}.edit-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.toolbar .btn{flex:1 1 130px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>SearchID</h1>
    <p>Consulta de Centros Educativos</p>
    <form id="searchForm" class="search">
      <input id="idInput" type="text" autocomplete="off" placeholder="Ingresa el ID de la escuela" aria-label="ID de la escuela">
      <button id="searchBtn" class="btn dark" type="submit">Buscar</button>
    </form>
    <div id="status">Base central conectada.</div>
  </section>
  <section id="result" class="hidden">
    <div id="summary"></div>
    <div id="toolbar" class="toolbar"></div>
    <div id="content"></div>
    <div id="message"></div>
  </section>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/+esm";

const db=createClient("https://hlugnatsqplwocglkudw.supabase.co","sb_publishable_pgVBfQOR_vnmwCpvdAu8Og_yBhKm7nZ");
const result=document.getElementById("result"),summary=document.getElementById("summary"),toolbar=document.getElementById("toolbar"),content=document.getElementById("content"),message=document.getElementById("message"),status=document.getElementById("status"),form=document.getElementById("searchForm"),idInput=document.getElementById("idInput"),searchBtn=document.getElementById("searchBtn");
let current=null,editing=false,pendingPhoto=null,pendingUrl=null,removePhoto=false;
const empties=new Set(["","0","sin datos","sin dato","sin información","sin informacion","nan","null"]);
function isEmpty(v){return v===null||v===undefined||empties.has(String(v).trim().toLowerCase())}
function show(v){return isEmpty(v)?"Sin información":String(v)}
function editVal(v){return isEmpty(v)?"":String(v)}
function esc(v){return String(v??"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]})}
function setStatus(t,e){status.textContent=t;status.style.color=e?"#ffe2e2":"#d8fff0"}
function setMessage(t,e){message.innerHTML='<div class="message '+(e?"err":"ok")+'">'+esc(t)+'</div>'}
function photoUrl(path){if(!path)return null;const d=db.storage.from("escuelas").getPublicUrl(path).data;return d&&d.publicUrl?d.publicUrl+"?v="+encodeURIComponent(current&&current.updated_at?current.updated_at:Date.now()):null}
function photoHTML(editMode){let src=pendingUrl||(!removePhoto&&current&&current.foto_path?photoUrl(current.foto_path):null);let h=src?'<img src="'+esc(src)+'" alt="Foto de '+esc(current&&current.nombre_escuela?current.nombre_escuela:"la escuela")+'">':'<div class="no-photo"><b>🏫</b>Sin foto registrada</div>';if(editMode){h+='<div class="photo-actions"><button type="button" class="btn light" id="choosePhoto">📷 '+(src?"Cambiar":"Subir")+'</button><button type="button" class="btn danger" id="removePhoto" '+(src?"":"disabled")+'>Eliminar</button></div><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden>'}return '<div class="photo">'+h+'</div>'}
function renderSummary(){summary.innerHTML='<section class="summary"><div class="school"><div class="eyebrow">Centro educativo</div><h2>'+esc(show(current.nombre_escuela))+'</h2><div class="badges"><span class="badge">ID '+esc(show(current.id))+'</span><span class="badge">MINTIC '+esc(show(current.id_mintic))+'</span><span class="badge">Fase '+esc(show(current.fase))+'</span></div></div>'+photoHTML(editing)+'</section>';if(editing)bindPhoto()}
function row(l,v){return '<div class="row"><div class="label">'+esc(l)+'</div><div class="value '+(isEmpty(v)?"empty":"")+'">'+esc(show(v))+'</div></div>'}
function contact(n,p,e,f,e2){if([n,p,e,f,e2].every(isEmpty))return "";let a=[];if(!isEmpty(p))a.push("📞 "+esc(p));if(!isEmpty(f))a.push("☎️ "+esc(f));if(!isEmpty(e))a.push("✉️ "+esc(e));if(!isEmpty(e2))a.push("✉️ "+esc(e2));return '<div class="contact"><div class="name">'+esc(show(n))+'</div><div class="meta">'+(a.length?a.join("<br>"):'<span class="empty">Sin datos de contacto</span>')+'</div></div>'}
function renderView(){editing=false;pendingPhoto=null;removePhoto=false;if(pendingUrl){URL.revokeObjectURL(pendingUrl);pendingUrl=null}renderSummary();toolbar.innerHTML='<button type="button" class="btn primary" id="editBtn">✏️ Editar información</button>';document.getElementById("editBtn").addEventListener("click",startEdit);content.innerHTML='<div class="grid"><section class="card"><h3>📍 Ubicación</h3>'+row("Departamento",current.departamento)+row("Municipio",current.municipio)+row("Centro poblado",current.centro_poblado)+row("Latitud",current.latitud)+row("Longitud",current.longitud)+'</section><section class="card"><h3>⚙️ Información técnica</h3>'+row("Solución de energía",current.tipo_solucion_energia)+row("BTS CN Maestro",current.bts_cn_maestro)+'</section></div><section class="card contacts"><h3>👥 Contactos</h3><div class="contact-grid">'+contact(current.docente_1,current.telefono_1,current.correo_1,null,null)+contact(current.docente_2,current.telefono_2,current.correo_2,null,null)+contact(current.docente_3,current.telefono_3,current.correo_3,current.telefono_fijo,current.correo_4)+'</div></section><div class="note">Los valores vacíos, 0 y “Sin datos” se muestran como “Sin información”.</div>'}
function field(k,l,full){return '<div class="field '+(full?"full":"")+'"><label for="f_'+k+'">'+esc(l)+'</label><input id="f_'+k+'" data-field="'+k+'" type="text" value="'+esc(editVal(current[k]))+'"></div>'}
function startEdit(){editing=true;message.innerHTML="";renderSummary();toolbar.innerHTML='<button type="button" class="btn light" id="cancelBtn">Cancelar</button><button type="button" class="btn primary" id="saveBtn">Guardar cambios</button>';document.getElementById("cancelBtn").addEventListener("click",renderView);document.getElementById("saveBtn").addEventListener("click",saveChanges);content.innerHTML='<section class="card"><h3>🏫 Información general</h3><div class="edit-grid">'+field("id","ID")+field("id_mintic","ID MINTIC")+field("fase","Fase")+field("nombre_escuela","Nombre de la escuela",true)+'</div></section><div class="grid"><section class="card"><h3>📍 Ubicación</h3><div class="edit-grid">'+field("departamento","Departamento")+field("municipio","Municipio")+field("centro_poblado","Centro poblado",true)+field("latitud","Latitud")+field("longitud","Longitud")+'</div></section><section class="card"><h3>⚙️ Información técnica</h3><div class="edit-grid">'+field("tipo_solucion_energia","Solución de energía",true)+field("bts_cn_maestro","BTS CN Maestro",true)+'</div></section></div><section class="card contacts"><h3>👥 Contactos</h3><div class="contact-grid"><div class="edit-contact"><h4>Contacto 1</h4><div class="edit-grid">'+field("docente_1","Nombre")+field("telefono_1","Teléfono")+field("correo_1","Correo")+'</div></div><div class="edit-contact"><h4>Contacto 2</h4><div class="edit-grid">'+field("docente_2","Nombre")+field("telefono_2","Teléfono")+field("correo_2","Correo")+'</div></div><div class="edit-contact"><h4>Contacto 3</h4><div class="edit-grid">'+field("docente_3","Nombre")+field("telefono_3","Teléfono")+field("telefono_fijo","Teléfono fijo")+field("correo_3","Correo 1")+field("correo_4","Correo 2")+'</div></div></div></section>'}
function bindPhoto(){const choose=document.getElementById("choosePhoto"),input=document.getElementById("photoInput"),remove=document.getElementById("removePhoto");if(!choose||!input||!remove)return;choose.addEventListener("click",function(){input.click()});input.addEventListener("change",function(){const f=input.files&&input.files[0];if(!f)return;const allowed=["image/jpeg","image/png","image/webp","image/heic","image/heif"];if(!allowed.includes(f.type)){alert("Formato no permitido. Usa JPG, PNG, WEBP, HEIC o HEIF.");return}if(f.size>10*1024*1024){alert("La imagen supera el máximo de 10 MB.");return}pendingPhoto=f;removePhoto=false;if(pendingUrl)URL.revokeObjectURL(pendingUrl);pendingUrl=URL.createObjectURL(f);renderSummary()});remove.addEventListener("click",function(){pendingPhoto=null;removePhoto=true;if(pendingUrl){URL.revokeObjectURL(pendingUrl);pendingUrl=null}renderSummary()})}
function getText(k){const el=document.querySelector('[data-field="'+k+'"]');if(!el)return null;const v=el.value.trim();return v===""?null:v}
function busy(on){result.classList.toggle("busy",on);searchBtn.disabled=on;const b=document.getElementById("saveBtn");if(b)b.disabled=on}
async function saveChanges(){const oldId=current.id,newId=getText("id");if(!newId){setMessage("El ID no puede quedar vacío.",true);return}const latRaw=getText("latitud"),lonRaw=getText("longitud"),lat=latRaw===null?null:Number(latRaw.replace(",",".")),lon=lonRaw===null?null:Number(lonRaw.replace(",","."));if(latRaw!==null&&!Number.isFinite(lat)){setMessage("La latitud no es válida.",true);return}if(lonRaw!==null&&!Number.isFinite(lon)){setMessage("La longitud no es válida.",true);return}
const p={id:newId,id_mintic:getText("id_mintic"),fase:getText("fase"),nombre_escuela:getText("nombre_escuela"),departamento:getText("departamento"),municipio:getText("municipio"),centro_poblado:getText("centro_poblado"),latitud:lat,longitud:lon,tipo_solucion_energia:getText("tipo_solucion_energia"),bts_cn_maestro:getText("bts_cn_maestro"),docente_1:getText("docente_1"),telefono_1:getText("telefono_1"),correo_1:getText("correo_1"),docente_2:getText("docente_2"),telefono_2:getText("telefono_2"),correo_2:getText("correo_2"),docente_3:getText("docente_3"),telefono_3:getText("telefono_3"),telefono_fijo:getText("telefono_fijo"),correo_3:getText("correo_3"),correo_4:getText("correo_4"),foto_path:current.foto_path};
try{busy(true);setMessage("Guardando cambios…");if(newId!==oldId){const q=await db.from("escuelas").select("id").eq("id",newId).maybeSingle();if(q.error)throw q.error;if(q.data)throw new Error("Ya existe una escuela con el ID "+newId+".")}
if(pendingPhoto){const safe=newId.replace(/[^A-Za-z0-9_-]/g,"_"),path=safe+"/principal";const u=await db.storage.from("escuelas").upload(path,pendingPhoto,{upsert:true,contentType:pendingPhoto.type||"image/jpeg",cacheControl:"3600"});if(u.error)throw u.error;if(current.foto_path&&current.foto_path!==path)await db.storage.from("escuelas").remove([current.foto_path]);p.foto_path=path}else if(removePhoto){if(current.foto_path){const d=await db.storage.from("escuelas").remove([current.foto_path]);if(d.error)throw d.error}p.foto_path=null}
const r=await db.from("escuelas").update(p).eq("id",oldId).select().single();if(r.error)throw r.error;current=r.data;idInput.value=current.id;renderView();setMessage("Cambios guardados correctamente.")}catch(e){console.error(e);setMessage(e&&e.message?e.message:"No se pudieron guardar los cambios.",true)}finally{busy(false)}}
async function searchSchool(id){const x=String(id||"").trim();if(!x){setStatus("Escribe un ID para realizar la consulta.",true);result.classList.add("hidden");return}try{searchBtn.disabled=true;searchBtn.textContent="Buscando…";setStatus("Consultando la base…",false);message.innerHTML="";const r=await db.from("escuelas").select("*").eq("id",x).maybeSingle();if(r.error)throw r.error;if(!r.data){result.classList.add("hidden");setStatus("No encontré una escuela con ese ID.",true);return}current=r.data;result.classList.remove("hidden");renderView();setStatus("Escuela encontrada.",false)}catch(e){console.error(e);result.classList.add("hidden");setStatus("No fue posible consultar la base en este momento.",true)}finally{searchBtn.disabled=false;searchBtn.textContent="Buscar"}}
form.addEventListener("submit",function(e){e.preventDefault();searchSchool(idInput.value)});
</script>
</body>
</html>
